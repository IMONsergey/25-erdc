name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout version 2
        uses: actions/checkout@v4
        with:
          ref: design/editorial-atlas-v2
          path: .preview-source

      - name: Preserve existing Figma imagery
        run: |
          if [[ ! -f assets/.webp-v2 || ! -f assets/city-lineart-vladivostok.webp ]]; then
            sudo apt-get update
            sudo apt-get install --yes webp
          fi
          bash scripts/fetch-assets.sh
          cd .preview-source
          bash scripts/fetch-assets.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .preview-source/package-lock.json

      - name: Cache original portal imagery
        uses: actions/cache@v4
        with:
          path: assets/source
          key: portal-media-${{ hashFiles('src/content/media.json') }}
          restore-keys: portal-media-

      - name: Prepare original portal imagery
        run: |
          python -m pip install Pillow
          python scripts/fetch-portal-assets.py
          cp -a assets/source .preview-source/assets/
          cd .preview-source
          python scripts/fetch-portal-assets.py

      - name: Build current site unchanged
        run: |
          npm ci
          npm run build

      - name: Build version 2
        working-directory: .preview-source
        id: preview
        env:
          PREVIEW_URL: https://imonsergey.github.io/25-erdc/v2/
        run: |
          npm ci
          npm run build
          export PREVIEW_COMMIT="$(git rev-parse HEAD)"
          node scripts/prepare-pages-preview.mjs
          echo "sha=${PREVIEW_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Combine the two versions
        run: |
          mkdir -p _site/v2
          cp -a dist/. _site/
          cp -a .preview-source/dist/. _site/v2/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload both versions
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify both public versions
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PREVIEW_COMMIT: ${{ steps.preview.outputs.sha }}
        run: |
          for attempt in {1..12}; do
            ready=true
            curl --fail --location --silent --show-error "${PAGE_URL}" --output /tmp/current.html || ready=false
            curl --fail --location --silent --show-error "${PAGE_URL}v2/version.json" --output /tmp/preview.json || ready=false
            if ! python -c 'import json, os; assert json.load(open("/tmp/preview.json"))["commit"] == os.environ["PREVIEW_COMMIT"]'; then ready=false; fi
            for page in v2/ v2/primorye/ v2/vladivostok/ v2/cities/ulan-ude/ v2/projects/ v2/news/; do
              curl --fail --location --silent --show-error "${PAGE_URL}${page}" --output /dev/null || ready=false
            done
            curl --fail --location --silent --show-error "${PAGE_URL}v2/assets/home-hero.webp" --output /dev/null || ready=false
            if [[ "$ready" == true ]]; then exit 0; fi
            sleep 5
          done
          echo "The two public versions did not become ready." >&2
          exit 1
