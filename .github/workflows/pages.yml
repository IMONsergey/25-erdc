name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and preserve Figma assets
        run: |
          sudo apt-get update
          sudo apt-get install --yes webp
          bash scripts/fetch-assets.sh
          if [[ -n "$(git status --porcelain assets)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Preserve Figma assets"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --location --silent --show-error "${PAGE_URL}" --output /tmp/page.html; then
              grep --quiet "Агломерация Владивосток" /tmp/page.html
              curl --fail --location --silent --show-error "${PAGE_URL}assets/hero-vladivostok.webp" --output /dev/null
              curl --fail --location --silent --show-error "${PAGE_URL}assets/fonts/tiktok-sans-cyrillic.woff2" --output /dev/null
              exit 0
            fi
            sleep 5
          done
          echo "The public GitHub Pages URL did not become ready." >&2
          exit 1
